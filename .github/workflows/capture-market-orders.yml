name: Capture ESI market orders by region

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a new snapshot even when page 1 matches the saved Last-Modified."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: capture-market-orders
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Zstandard compression
        run: python -m pip install --disable-pip-version-check zstandard

      - name: Capture all regions using four region workers
        run: python scripts/capture_market_orders.py
        env:
          FORCE_CAPTURE: ${{ inputs.force }}
          PYTHONUNBUFFERED: "1"

      - name: Commit and push completed regional snapshots
        if: always()
        run: |
          mkdir -p data/esi/mkt
          git add -A data/esi/mkt
          if git diff --cached --quiet; then
            echo "Regional market snapshots and headers are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update regional ESI market order snapshots"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          echo "Failed to push after multiple attempts."
          exit 1
